    (function () {
      var html = document.documentElement;
      var initialScheme = html.getAttribute("data-color-scheme");
      var illustrationUrl = html.getAttribute("data-illustration");

      var LOGO_DARK =
          "https://static.kleinanzeigen.de/static/img/common/logo/logo-kleinanzeigen-dark-mode.svg";
      var LOGO_LIGHT =
          "https://static.kleinanzeigen.de/static/img/common/logo/logo-kleinanzeigen-horizontal.svg";

      var updateLogos = function (isDark) {
        var headerLogo = document.querySelector(".knz-header__logo-img");
        var centerLogo = document.getElementById("prompt-logo-center");

        if (headerLogo) {
          headerLogo.src = isDark ? LOGO_DARK : LOGO_LIGHT;
        }

        if (centerLogo) {
          centerLogo.style.setProperty("content", "unset", "important");
          if (illustrationUrl) {
            centerLogo.src = illustrationUrl;
          } else {
            if (isDark) {
              centerLogo.src = LOGO_DARK;
            } else {
              centerLogo.src = LOGO_LIGHT;
            }
            centerLogo.style.display = "block"; /* not add !important */
          }
        }
      };

      // --- CASE 1: HARDCODED DARK ---
      if (initialScheme === "dark") {
        document.addEventListener("DOMContentLoaded", function () {
          updateLogos(true);
        });
        return;
      }

      // --- CASE 2: HARDCODED LIGHT ---
      if (initialScheme === "light") {
        document.addEventListener("DOMContentLoaded", function () {
          updateLogos(false);
        });
        return;
      }

      // --- CASE 3: SYSTEM (or empty) ---
      if (initialScheme === "system" || !initialScheme) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");

          html.setAttribute("data-color-scheme", isDark ? "dark" : "light");

              document.readyState === "interactive" ||
              document.readyState === "complete"
          ) {
            updateLogos(isDark);
          }
        };

        // Run immediately
        applySystemTheme(mq.matches);

        // Listen for live changes
        mq.addEventListener("change", function (e) {
          applySystemTheme(e.matches);
        });

        // Ensure logos update on load
        document.addEventListener("DOMContentLoaded", function () {
          var current = html.getAttribute("data-color-scheme");
          updateLogos(current === "dark");
        });
      }
    })();

  <script>
    function fireAndNavigate(eventName, url) {
      const fallback = setTimeout(function () { window.location.href = url; }, 2500);
      window.dataLayer.push({
        'event': 'gaEvent',
        'eventAction': eventName,
        eventCallback: function () { clearTimeout(fallback); window.location.href = url; },
        eventTimeout: 2000
      });
    }

    function watchForLoginError() {
      let timeoutId;
      const root = document.querySelector("form[data-form-primary='true']") || document.body;
      const obs = new MutationObserver(function () {
        if (root.querySelector("[data-error-code]")) {
          obs.disconnect();
          clearTimeout(timeoutId);
          window.dataLayer.push({ 'event': 'gaEvent', 'eventAction': 'LoginFail' });
        }
      });
      timeoutId = setTimeout(function () { obs.disconnect(); }, 5000);
      obs.observe(root, { childList: true, subtree: true, attributeFilter: ["data-error-code"] });
    }

    document.addEventListener("DOMContentLoaded", function () {
      try {
        const backBtn = document.querySelector(".knz-header__back");
        if (backBtn) {
          backBtn.addEventListener("click", function (ev) {
            const dest = backBtn.getAttribute("href");
            try {
              ev.preventDefault();
              fireAndNavigate("LoginCancel", dest);
            } catch (e) {
              window.location.href = dest;
            }
          });
        }

        const helpLink = document.querySelector(".knz-header__help-link");
        if (helpLink) {
          helpLink.addEventListener("click", function () {
            window.dataLayer.push({ 'event': 'gaEvent', 'eventAction': 'FooterClick', event_label: "Help" });
          });
        }

        document.body.addEventListener("click", function (e) {
          try {
            const link = e.target.closest("a");
            if (!link) return;

            const href = link.getAttribute("href") || "";

            if (href.includes("/login/password-reset-start/")) {
              e.preventDefault();
              fireAndNavigate("PasswordRequestResetBegin", href);
              return;
            }

            if (href.includes("m-benutzer-anmeldung")) {
              e.preventDefault();
              fireAndNavigate("UserRegistrationBegin", href);
              return;
            }
          } catch (e) {}
        });

        if ("login-id" === "login-password") {
          if (document.querySelector("[data-error-code]")) {
            window.dataLayer.push({ 'event': 'gaEvent', 'eventAction': 'LoginFail' });
          } else {
            watchForLoginError();
          }

          const submitBtn = document.querySelector("button[type='submit']");
          if (submitBtn) {
            let attemptSent = false;
            submitBtn.addEventListener("click", function () {
              try {
                if (!attemptSent) {
                  attemptSent = true;
                  window.dataLayer.push({ 'event': 'gaEvent', 'eventAction': 'LoginAttempt' });
                  setTimeout(function () { attemptSent = false; }, 2000);
                }
              } catch (e) {}
            });
          }
        }
      } catch (e) {}
    });
  </script>
