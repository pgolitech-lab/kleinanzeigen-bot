<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Стек карточек</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="shell">
  <section id="left" class="pane left" aria-label="Очередь и списки">
    <div id="tabview" class="tabview"></div>
    <nav id="tabbar" class="tabbar" aria-label="Разделы">
      <button class="tab" data-tab="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M7 4h10"/></svg>
        <span>Разбор</span><i class="tab-badge" id="tabBadge"></i>
      </button>
      <button class="tab" data-tab="all">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
        <span>Все треды</span>
      </button>
      <button class="tab" data-tab="sales">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
        <span>Продажи</span>
      </button>
    </nav>
  </section>
  <section id="right" class="pane right" aria-label="Тред или клиент"></section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<script src="../_shared/mock.js"></script>
<script src="app.js"></script>
</body>
</html>
