{# Окно логов с авто-обновлением: polling /api/logs каждые 2с с инкрементальной подгрузкой по id. #}
{% extends "base.html" %}

{% block title %}Логи — Kleinanzeigen Bot{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Логи</h1>
    <div class="d-flex gap-2 align-items-center">
        <span class="badge bg-secondary" id="log-count">— записей</span>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="auto-scroll" checked>
            <label class="form-check-label" for="auto-scroll">Авто-скролл</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="auto-refresh" checked>
            <label class="form-check-label" for="auto-refresh">Авто-обновление (2с)</label>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="clear-btn">Очистить окно</button>
    </div>
</div>

<div class="log-window" id="log-window"></div>

{% endblock %}

{% block scripts %}
<script>
(function() {
    const win = document.getElementById('log-window');
    const counter = document.getElementById('log-count');
    const autoScroll = document.getElementById('auto-scroll');
    const autoRefresh = document.getElementById('auto-refresh');
    const clearBtn = document.getElementById('clear-btn');

    let lastId = null;
    let count = 0;
    let timer = null;

    function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function appendEntries(entries) {
        if (!entries.length) return;
        const frag = document.createDocumentFragment();
        for (const e of entries) {
            const div = document.createElement('div');
            div.innerHTML =
                '<span class="ts">' + escapeHtml(e.ts) + '</span> ' +
                '<span class="lvl-' + escapeHtml(e.level) + '">' + escapeHtml(e.level.padEnd(7)) + '</span> ' +
                '<span class="name">' + escapeHtml(e.name) + '</span>: ' +
                escapeHtml(e.msg);
            frag.appendChild(div);
        }
        win.appendChild(frag);
        count += entries.length;
        counter.textContent = count + ' записей';
        if (autoScroll.checked) win.scrollTop = win.scrollHeight;
    }

    async function poll() {
        try {
            const url = lastId === null ? '/api/logs' : '/api/logs?since=' + lastId;
            const r = await fetch(url);
            if (!r.ok) return;
            const data = await r.json();
            appendEntries(data.entries);
            lastId = data.last_id;
        } catch (e) {
            // тихо игнорируем сетевые ошибки — попробуем снова через 2с
        }
    }

    function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(poll, 2000);
    }

    autoRefresh.addEventListener('change', () => {
        if (autoRefresh.checked) startTimer();
        else if (timer) { clearInterval(timer); timer = null; }
    });

    clearBtn.addEventListener('click', () => {
        win.innerHTML = '';
        count = 0;
        counter.textContent = '0 записей';
    });

    poll();        // первый load
    startTimer();  // потом каждые 2с
})();
</script>
{% endblock %}
